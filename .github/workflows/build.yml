name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test and build
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CodeScanner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CodeScanner-apk
          path: CodeScanner.apk

      - name: Publish release (direct APK download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" CodeScanner.apk \
            --title "Code Scanner build ${{ github.run_number }}" \
            --notes "Download CodeScanner.apk on your phone and open it to install." \
            --latest
